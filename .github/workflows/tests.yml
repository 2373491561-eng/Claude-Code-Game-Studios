name: Run GUT Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.2-stable_linux.x86_64
          sudo mv Godot_v4.6.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Run GUT Tests
        run: |
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=tests/unit -gdir=tests/integration -gexit
