name: Run GUT Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: 4.6.2
      - name: Run GUT Tests
        run: |
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=tests/unit -gdir=tests/integration -gexit
